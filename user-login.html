<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Login - Hotspot Mapper</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/auth.css">
  <script type="module" src="/js/theme.js"></script>
  <script type="module" src="/js/navigation.js"></script>
</head>
<body class="auth-bg min-h-screen flex flex-col items-center justify-center p-6 relative">

  <!-- Top bar theme toggle -->
  <div class="absolute top-6 right-6">
    <button class="theme-toggle-btn flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-slate-700 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md hover:bg-slate-100 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm transition-all cursor-pointer">
      <span class="theme-icon text-sm">🌙</span>
      <span class="theme-label hidden sm:inline">Dark Mode</span>
    </button>
  </div>

  <div class="auth-card bg-white p-8 rounded-3xl w-full max-w-md">
    <!-- Header -->
    <div class="text-center space-y-2.5 mb-8">
      <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white text-xl mx-auto shadow-md shadow-blue-100">
        👥
      </div>
      <h2 class="font-display font-extrabold text-2xl text-slate-800 tracking-tight">Public User Portal</h2>
      <p class="text-xs text-slate-400">Log in to Hotspot Mapper Public User Portal</p>
    </div>

    <!-- Alert Message Box -->
    <div id="status-message" class="hidden p-4 mb-5 rounded-xl text-xs font-semibold border"></div>

    <!-- Form -->
    <form id="user-login-form" class="space-y-4">
      <div class="space-y-1">
        <label for="email" class="text-xs font-bold text-slate-700">Email Address</label>
        <input type="email" id="email" required placeholder="user@safety.org" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 transition-all">
      </div>
      
      <div class="space-y-1">
        <div class="flex justify-between items-center">
          <label for="password" class="text-xs font-bold text-slate-700">Password</label>
          <button type="button" id="forgot-password-btn" class="text-[11px] font-semibold text-blue-600 hover:underline focus:outline-none cursor-pointer">Forgot Password?</button>
        </div>
        <input type="password" id="password" required placeholder="••••••••" class="w-full px-4 py-3 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-blue-500 transition-all">
      </div>

      <button type="submit" id="submit-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-xl shadow-lg shadow-blue-100 transition-all cursor-pointer">
        Log In as User
      </button>
    </form>

    <!-- Additional links -->
    <div class="mt-8 pt-6 border-t border-slate-50 text-center space-y-4">
      <p class="text-xs text-slate-500">
        Don't have an account? <a href="register.html" class="text-blue-600 font-bold hover:underline">Register Now</a>
      </p>
      <p class="text-xs text-slate-400">
        For demo testing, use:<br>
        <code class="font-mono text-[10px] bg-slate-100 px-1 py-0.5 rounded text-slate-600 font-bold">email: user@safety.org</code> / 
        <code class="font-mono text-[10px] bg-slate-100 px-1 py-0.5 rounded text-slate-600 font-bold">password: user123</code>
      </p>
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-slate-800 transition-all">
        ← Return to Home Page
      </a>
    </div>
  </div>

  <script type="module">
    import { loginUser, resetPassword } from "/js/auth.js";
    
    const form = document.getElementById("user-login-form");
    const statusEl = document.getElementById("status-message");
    const submitBtn = document.getElementById("submit-btn");
    const forgotBtn = document.getElementById("forgot-password-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      statusEl.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.innerText = "Signing in...";

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        await loginUser(email, password);
        window.location.href = "user-dashboard.html";
      } catch (err) {
        statusEl.innerText = err.message;
        statusEl.className = "p-4 mb-5 rounded-xl text-xs font-semibold bg-red-50 text-red-600 border border-red-100";
        statusEl.classList.remove("hidden");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Log In as User";
      }
    });

    // Forgot password trigger
    forgotBtn.addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      if (!email) {
        statusEl.innerText = "Please enter your email address in the field above first.";
        statusEl.className = "p-4 mb-5 rounded-xl text-xs font-semibold bg-yellow-50 text-yellow-700 border border-yellow-100";
        statusEl.classList.remove("hidden");
        return;
      }

      try {
        await resetPassword(email);
        statusEl.innerText = "Password reset link has been sent to your email.";
        statusEl.className = "p-4 mb-5 rounded-xl text-xs font-semibold bg-green-50 text-green-700 border border-green-100";
        statusEl.classList.remove("hidden");
      } catch (err) {
        statusEl.innerText = err.message;
        statusEl.className = "p-4 mb-5 rounded-xl text-xs font-semibold bg-red-50 text-red-600 border border-red-100";
        statusEl.classList.remove("hidden");
      }
    });
  </script>
</body>
</html>
